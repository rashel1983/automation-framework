# ============================================================
# ASR-TEK Portal — Automation Framework Configuration
# ============================================================

# Browser: chrome | firefox | edge
browser=chrome

# Environment: local | dev | qa | staging | prod
env=qa

# Run browser without a UI (useful for CI pipelines)
headless=false

# Selenium wait timeouts (seconds)
browser.implicit.wait=10
browser.page.load.timeout=60

# Capture screenshot automatically when a scenario fails
screenshot.on.failure=true

# Reuse the same browser session for the same user across scenarios
session.reuse=true

# How many minutes before a reused session is considered stale and replaced
session.timeout.minutes=30

# Number of parallel threads for concurrent scenario execution
parallel.thread.count=3

# ============================================================
# Environment base URLs  (UI — Angular frontend)
# ============================================================
#url.local=http://localhost:4200
url.local=http://localhost:8083
url.qa=https://qa-asr-tek.com
url.staging=https://staging.asr-tek.com
url.prod=https://app.asr-tek.com

# ============================================================
# API base URLs  (Spring Boot backend /api)
# ============================================================
#api.url.local=http://localhost:8080/api
#api.url.dev=http://localhost:8080/api
#api.url.qa=https://qa-asr-tek.com/api
#api.url.staging=https://staging.asr-tek.com/api
a#pi.url.prod=https://app.asr-tek.com/api

# ============================================================
# Mobile (Appium) Configuration
# ============================================================
# Platform: android | ios
#mobile.platform=android
#mobile.platform.version=13
#mobile.device.name=emulator-5554

# Type: web (browser on device) | native (installed .apk / .ipa)
#mobile.type=web

# Native app path — only used when mobile.type=native
# mobile.app=/path/to/your/app.apk

# Appium 2.x server URL (no /wd/hub suffix)
# Appium 1.x: http://localhost:4723/wd/hub
#mobile.appium.url=http://localhost:4723

# Keep app state between scenarios (false = fresh app each scenario)
#mobile.no.reset=true

# Implicit wait for mobile elements (seconds)
#mobile.implicit.wait=10
